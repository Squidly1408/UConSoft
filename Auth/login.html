<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UConSoft - Login</title>
    <link rel="stylesheet" href="../Colours.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    
    <button class="theme-toggle">Toggle Dark Mode</button>

    <div class="login-card">
        
        <h2>uConSoft Login</h2>
        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="your.email@uon.edu.au" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>
        <div class="login-footer">
            If you forgot your password contact your UON admin here: <a href="mailto:admin@uconsoft.com"><span class="forgot-password">Forgot Password</span></a><br> or <br> Visit the <a href="../public.html"><span class="forgot-password">Public Page</span></a> <br> or the <a href="../index.html"><span class="forgot-password">Welcome Page</span></a>.
        </div>
    </div>

    <script src="./auth.js"></script>
</body>

</html>
